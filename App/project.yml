# XcodeGen spec for the fmscript2xml app (D17). Generate with:
#   xcodegen generate --spec App/project.yml
# The generated App/FMScriptPaste.xcodeproj is not committed.
name: FMScriptPaste
options:
  bundleIdPrefix: io.github.ariera
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"  # shown as "0.1 beta" (every 0.x is a beta)
    CURRENT_PROJECT_VERSION: "1"
    # Dev builds are ad-hoc signed; Developer ID signing is Phase 6.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
packages:
  fmscript2xml:
    path: ..
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  FMScriptPaste:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      # Generated by XcodeGen (not committed); merged with the INFOPLIST_KEY_* settings
      path: Info.plist
      properties:
        LSUIElement: true
        SUFeedURL: https://github.com/ariera/fmscript2xml-app/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: false
    dependencies:
      - package: fmscript2xml
        product: FMScriptKit
      - package: fmscript2xml
        product: FMClipboard
      - package: fmscript2xml
        product: FMHistory
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: fmscript2xml
        # Keep the Swift module name distinct from the package's fmscript2xml CLI target
        PRODUCT_MODULE_NAME: FMScriptPasteApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ariera.fmscript2xml
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sparkle's public EdDSA key (safe to commit). Empty disables updates.
        # Generate the key pair once with Sparkle's generate_keys (PLAN §10, Phase 6).
        SPARKLE_PUBLIC_ED_KEY: "d8i4OGMJtrix3YWGFgTQE/nK3un1SeEDnY8Bk4crf14="
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: fmscript2xml
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 the fmscript2xml-app contributors. Created by Alejandro Riera. GPL-3.0-or-later."
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
